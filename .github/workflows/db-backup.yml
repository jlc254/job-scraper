name: db-backup

# Neon Free keeps six hours of point-in-time recovery and nothing else. A bad publish
# noticed the next morning has no restore point left, so this is the copy that lives
# outside Neon: one verified logical dump a week, kept as a workflow artifact.
#
# Sunday 04:17 UTC. The minute is off the hour because GitHub delays those most, and the
# slot sits after the daily run (03:07 UTC) so the dump captures that day's publish.
"on":
  schedule:
    - cron: "17 4 * * 0"
  # workflow_dispatch has no branch filter, so the job below rejects non-default refs.
  workflow_dispatch:

permissions:
  contents: read

# Serialize dumps: two backups of the same day are redundant, and overlapping runs
# would upload two artifacts with the same name. cancel-in-progress is false so a
# newer run cannot kill one mid-verification, replacing a finished dump with a
# half-written one (or none at all).
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A manual dispatch can target any branch or tag. Only the reviewed default branch
    # may handle the production DSN; schedule events already run on that ref.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      # Only scripts/db_dump.sh is needed; the dump itself runs inside postgres:18 because
      # the runner's client 16 cannot talk to a PG 18 server. Pin the checkout to the
      # default branch explicitly: even for a dispatch that names another ref, the code
      # receiving the secret below is the reviewed script, not a caller-supplied copy.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The script refuses a pooled host, writes to a dot-prefixed temporary file, and
      # renames only after the size floor and `pg_restore --list` both pass, so a failed
      # run leaves no artifact and cannot overwrite the previous one.
      - name: Dump and verify
        env:
          NEON_DATABASE_URL_PUBLISHER: ${{ secrets.NEON_DATABASE_URL_PUBLISHER }}
          DUMP_DIR: backups
        run: bash scripts/db_dump.sh

      # if-no-files-found: error, so a run that dumped nothing is red instead of green
      # with an empty backup list. 56 days covers a mistake found after a holiday without
      # growing the artifact store without bound.
      - name: Upload the dump
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-backup
          path: backups/backup-*.dump
          if-no-files-found: error
          retention-days: 56

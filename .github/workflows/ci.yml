name: ci

# No secrets are used here and CI never calls a live job site (doc 11).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Types
        run: mypy src

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Tests
        run: pytest -q

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Single source of truth for the Node version: frontend/package.json engines.node,
          # which also matches frontend/Dockerfile. deploy.yml and preview.yml read the same file.
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

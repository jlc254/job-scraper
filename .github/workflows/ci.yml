name: ci

# No secrets are used here and CI never calls a live job site (doc 11).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@UNPINNED # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@UNPINNED # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt

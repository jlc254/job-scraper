name: ci

# No secrets are used here and CI never calls a live job site (doc 11).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: |
          if [[ ! -f requirements-dev.txt || $(grep -c -- '--hash' requirements-dev.txt || true) -eq 0 ]]; then
            echo "ERROR: requirements-dev.txt missing or lacks --hash entries" >&2
            exit 1
          fi
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: |
          if [[ ! -f requirements-dev.txt || $(grep -c -- '--hash' requirements-dev.txt || true) -eq 0 ]]; then
            echo "ERROR: requirements-dev.txt missing or lacks --hash entries" >&2
            exit 1
          fi
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Types
        run: mypy src

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: |
          if [[ ! -f requirements-dev.txt || $(grep -c -- '--hash' requirements-dev.txt || true) -eq 0 ]]; then
            echo "ERROR: requirements-dev.txt missing or lacks --hash entries" >&2
            exit 1
          fi
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Tests
        run: pytest -q

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: |
          if [[ ! -f requirements-dev.txt || $(grep -c -- '--hash' requirements-dev.txt || true) -eq 0 ]]; then
            echo "ERROR: requirements-dev.txt missing or lacks --hash entries" >&2
            exit 1
          fi
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Dependency audit
        run: pip-audit -r requirements.txt

name: ci

# No secrets are used here and CI never calls a live job site (doc 11).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Types
        run: mypy src

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Tests
        run: pytest -q

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Dependency audit
        run: pip-audit -r requirements.txt

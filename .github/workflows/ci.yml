name: ci

# No secrets are used here and CI never calls a live job site (doc 11).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Types
        run: mypy src

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Tests
        run: pytest -q

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Single source of truth for the Node version: frontend/package.json engines.node,
          # which also matches frontend/Dockerfile. deploy.yml and preview.yml read the same file.
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  secrets:
    # SEC-06: the pre-commit hook only exists if someone installed it, so the gate that
    # actually holds is this job. It deliberately has no `if:` and `pull_request` has no
    # `paths:` filter -- a credential arrives in whatever commit happens to carry it, and
    # a skipped run is indistinguishable from a passing one.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # gitleaks-action v3 lists the pull request's commits over the REST API, which
      # returns 403 without this. Read-only, and scoped to this job so no other job (and
      # no workflow-level default) gains the scope.
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a push event diffs against the previous tip, and a shallow
          # clone would hide the commit that introduced the secret.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # github.token rather than the GITHUB_TOKEN secret: ci.yml must never reference
          # an encrypted secret (doc 11), and on pull_request this is a read-only token
          # that cannot push back to the branch.
          GITHUB_TOKEN: ${{ github.token }}
          # Posting a PR comment needs `pull-requests: write`; findings already fail the
          # job, so keep the job read-only.
          GITLEAKS_ENABLE_COMMENTS: "false"

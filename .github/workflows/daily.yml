name: daily-run

# Runs at 06:07 and 16:07 EAT. GitHub cron is UTC only. The minute is off the hour on purpose:
# runs scheduled exactly on the hour are the ones GitHub delays most.
"on":
  schedule:
    - cron: "7 3 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = save, send and publish to Neon, no-notify = save but print the digest, dry-run = touch nothing, dashboard = only rebuild the Looker Studio tabs, publish = only refresh Neon from the Sheet"
        type: choice
        options: [normal, no-notify, dry-run, dashboard, publish]
        default: normal
      sources:
        description: "Optional comma-separated source ids, for example himalayas,jobicy"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: job-scraper-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        id: install
        run: python -m pip install --require-hashes --no-deps -r requirements.txt

      # Skipped in "publish" mode, which only refreshes Neon from the Sheet.
      # On scheduled runs inputs.mode is empty, so this step runs as normal.
      - name: Run
        if: ${{ inputs.mode != 'publish' }}
        timeout-minutes: 12
        env:
          MODE: ${{ inputs.mode || 'normal' }}
          SOURCES: ${{ inputs.sources || '' }}
          PYTHONUNBUFFERED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_COMMUNITY: ${{ secrets.TELEGRAM_CHAT_ID_COMMUNITY }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_ID_COMMUNITY: ${{ secrets.GOOGLE_SHEET_ID_COMMUNITY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: bash scripts/ci_run.sh

      # Unsaved results (storage failed) and sanitized samples of records that failed to parse.
      # `always()` so a degraded-but-green run still leaves its sample for debugging.
      - name: Keep debugging files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: run-files
          path: |
            output/unsaved-*.json
            output/samples/*.json
          if-no-files-found: ignore
          retention-days: 7

      # Success ping comes BEFORE publish on purpose: a successful fetch is never hidden
      # by a publish failure (decision D26). If publish then fails, the failure steps
      # below still fire, because they come after it.
      - name: Ping dead-man's switch
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "No dead-man's switch configured."
            exit 0
          fi
          curl --silent --show-error --fail --max-time 10 --retry 3 --config - <<EOF
          url = "${HEALTHCHECK_URL}"
          EOF

      # Refreshes the read-only Neon copy from the Google Sheet.
      # Runs on scheduled runs, normal runs and manual "publish" runs only.
      # `!cancelled()` lets it run even if Run exited non-zero (for example Telegram failed),
      # because the Sheet is still up to date. The install check stops it from running
      # when the dependencies never installed.
      - name: Publish to Neon
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (github.event_name == 'schedule' || inputs.mode == 'normal' || inputs.mode == 'publish') }}
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_ID_COMMUNITY: ${{ secrets.GOOGLE_SHEET_ID_COMMUNITY }}
          NEON_DATABASE_URL_PUBLISHER: ${{ secrets.NEON_DATABASE_URL_PUBLISHER }}
        run: python main.py publish

      # Self-contained on purpose (no repo scripts, no Python packages), so it still works
      # when checkout or the install step is what failed. The token goes through curl's
      # config on stdin, so it never appears in the process list.
      # Placed after Publish so a publish failure also raises this alert.
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --silent --show-error --fail --max-time 20 --retry 2 --config - \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=ALERT: job scraper run failed (${GITHUB_EVENT_NAME}). ${RUN_URL}" \
            --data-urlencode 'link_preview_options={"is_disabled":true}' <<EOF
          url = "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          EOF

      - name: Ping dead-man's switch on failure
        if: failure()
        continue-on-error: true
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            exit 0
          fi
          curl --silent --show-error --fail --max-time 10 --retry 3 --config - <<EOF
          url = "${HEALTHCHECK_URL}/fail"
          EOF
[project]
name = "jobscraper"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/jobscraper/utils/http.py" = ["S311"]  # random is only used for retry jitter
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser", "gspread.*", "google.*"]
ignore_missing_imports = true

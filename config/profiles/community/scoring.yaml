# Scoring rules (doc 06) for the "community" profile: community, program/events and DevRel first.
# Point values default to the doc 06 numbers except where listed below.
# Increment scoring_version on every change, and update the golden tests.
# Only keys the code reads are allowed. Unknown keys now fail at load.
scoring_version: 2

tiers: {top: 85, strong: 75, potential: 50}

# Partial skills (Basic level) count less than the default 0.5, so a technical ad that lists many
# tools you know only a little does not score like a real fit. Calibrate this on about 30 real jobs.
skills:
  partial_credit: 0.35

# Community Manager, Events Manager and Social Media Manager are target titles. Without these
# exceptions every one of them scores 2 of 10 on experience, because "manager" is penalised.
experience:
  manager_exceptions:
    - customer success manager
    - community manager
    - community engagement manager
    - events manager
    - event manager
    - social media manager

# Location points stay at the defaults: remote open to Kenya/Africa/worldwide 20, Nairobi on-site 20,
# other Kenyan city 16, remote region unstated 10. On-site Nairobi and Kenya roles still score.

filters:
  max_age_days: 30

  # Each list below REPLACES the code default, so the defaults are pasted first and extras added.
  # Every entry is a regex, matched case-insensitively. Use \b at word edges: a bare "us only"
  # would also match "focus only" or "bonus only".
  region_restricted_patterns:
    - '\b(?-i:US|U\.S\.)\s+(?:residents?|citizens?)\s+only\b'
    - '\b(?:(?-i:US|U\.S\.|UK|U\.K\.|EU)|usa|united states|canada|europe)\s+(?:only|residents? only)\b'
    - '\bmust (?:be )?(?:legally )?(?:authori[sz]ed|eligible) to work in (?:the )?(?:us|u\.s\.|usa|united states|uk|u\.k\.|united kingdom|eu|european union|canada|australia)\b'
    - '\bmust (?:reside|live|be (?:located|based)) in (?:the )?(?:us|u\.s\.|usa|united states|uk|united kingdom|eu|europe|canada|australia)\b'
    - '\bright to work in (?:the )?(?:uk|united kingdom|eu|us|usa|ireland)\b'
    # extras for this profile
    - '\b(?:north america|americas|latam|apac|eea|australia|united kingdom)\s+only\b'
    - '\bsecurity clearance\b'
    - '\b(?:pst|est)\s+(?:hours|time ?zone)\b'
    - '\b(?:us|north american)\s+time ?zone\s+only\b'
    # Remote-location strings, learned from the 26 Oct 2026 run. The country list deliberately
    # leaves out Kenya (and Africa) so a "Remote - Kenya" ad is never thrown away. Bare cities and
    # states are NOT matched: on WeWorkRemotely the Headquarters field names the company HQ, not
    # the role's location, so "Headquarters: London" must stay eligible.
    - '\bremote\s+within\s+(?:the\s+)?(?:(?-i:US|U\.S\.)|united states|usa|canada|mexico|brazil|argentina|chile|colombia|peru|uk|united kingdom|ireland|germany|france|spain|portugal|netherlands|belgium|switzerland|austria|italy|poland|sweden|norway|denmark|finland|czech republic|romania|hungary|greece|turkey|israel|uae|united arab emirates|saudi arabia|qatar|india|pakistan|bangladesh|sri lanka|singapore|malaysia|indonesia|philippines|vietnam|thailand|japan|south korea|korea|china|taiwan|hong kong|australia|new zealand|south africa|nigeria|egypt|ghana|morocco|tunisia|europe|eu|north america|apac|latam)(?![a-z])'
    - '\bremote\s*[-–—]\s*(?:(?-i:US|U\.S\.)|united states|usa|canada|mexico|brazil|argentina|chile|colombia|peru|uk|united kingdom|ireland|germany|france|spain|portugal|netherlands|belgium|switzerland|austria|italy|poland|sweden|norway|denmark|finland|czech republic|romania|hungary|greece|turkey|israel|uae|united arab emirates|saudi arabia|qatar|india|pakistan|bangladesh|sri lanka|singapore|malaysia|indonesia|philippines|vietnam|thailand|japan|south korea|korea|china|taiwan|hong kong|australia|new zealand|south africa|nigeria|egypt|ghana|morocco|tunisia|europe|eu|north america|apac|latam)(?![a-z])'
    - '\bremote\s*\(\s*(?:(?-i:US|U\.S\.)|united states|usa|canada|uk|united kingdom|ireland|germany|france|spain|portugal|netherlands|belgium|switzerland|austria|italy|poland|japan|korea|india|singapore|australia|new zealand|europe|eu|apac|latam|north america)\s*\)'
    - '\b(?:(?-i:US|U\.S\.)|united states|usa|canada|mexico|brazil|argentina|chile|colombia|peru|uk|united kingdom|ireland|germany|france|spain|portugal|netherlands|belgium|switzerland|austria|italy|poland|sweden|norway|denmark|finland|turkey|israel|uae|india|pakistan|bangladesh|sri lanka|singapore|malaysia|indonesia|philippines|vietnam|thailand|japan|south korea|korea|china|taiwan|hong kong|australia|new zealand|south africa|nigeria|egypt|ghana|morocco|tunisia|europe|eu|north america|apac|latam)\s*,\s*remote\b'
    - '\b(?:(?-i:US|U\.S\.)|united states|usa|canada|mexico|brazil|argentina|chile|colombia|peru|uk|united kingdom|ireland|germany|france|spain|portugal|netherlands|belgium|switzerland|austria|italy|poland|sweden|norway|denmark|finland|turkey|israel|uae|india|pakistan|bangladesh|sri lanka|singapore|malaysia|indonesia|philippines|vietnam|thailand|japan|south korea|korea|china|taiwan|hong kong|australia|new zealand|south africa|nigeria|egypt|ghana|morocco|tunisia|europe|eu|north america|apac|latam)\s+remote\b'
    - '\b(?:(?-i:US|U\.S\.)|united states|usa|canada|uk|united kingdom|ireland|germany|france|spain|portugal|netherlands|belgium|switzerland|austria|italy|poland|sweden|norway|denmark|finland|turkey|israel|uae|india|singapore|australia|new zealand|europe|eu|apac|latam|north america)\s*\((?:fully\s+)?remote\)'

  # Ads that demand a language the owner does not speak. English and Swahili are accepted, so they
  # never appear in these lists: the patterns only fire for a different language. A sentence that
  # marks the mention as optional ("a plus") is skipped by the filter, provided it carries no
  # requirement word; see the language_required handling in filters.py.
  language_required_patterns:
    - '\b(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\s*(?:&|and|/|\+)\s*(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\s+speaking\b'
    - '\b(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)[- ]speaking\b'
    - '\b(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\s*(?:&|and|/|\+)\s*(?:english|swahili)\s*[- ]?spea(?:king|ker)s?\b'
    - '\b(?:english|swahili)\s*(?:&|and|/|\+)\s*(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\s*[- ]?spea(?:king|ker)s?\b'
    - '\bbilingual\s+(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\b'
    - '\bbilingual\s+(?:english|swahili)\s+(?:and|&|/)\s+(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\b'
    - '\b(?:native|fluent|proficient)\s+(?:in\s+)?(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\b'
    - '\b(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\s+(?:is|are)\s+(?:required|mandatory|essential)\b'
    - '\b(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\s*\(\s*(?:required|mandatory|essential)\s*\)'
    - '\b(?:speak|write|read)\s+(?:fluent\s+)?(?:japanese|korean|french|german|spanish|portuguese|mandarin|cantonese|chinese|arabic|russian|italian|dutch|turkish|vietnamese|thai|indonesian|hindi|urdu|polish|hebrew|bengali|tamil|ukrainian|greek|czech|romanian|hungarian|swedish|norwegian|danish|finnish|persian|farsi|amharic|somali|zulu)\b'

  scam_patterns:
    - 'registration fee'
    - 'processing fee'
    - 'training fee'
    - 'refundable deposit'
    - '\bpay (?:a |an )?(?:fee )?to apply\b'
    - 'commission[- ]only'
    - '\bmlm\b'
    - 'multi[- ]level marketing'
    - '(?:apply|contact|reach us|message us)\s+(?:only\s+)?(?:via|on|through)\s+(?:whatsapp|telegram)'
    - 'whatsapp (?:only|number) to apply'
    # extras for this profile (mostly seen on regional boards)
    - '\bapplication fee\b'
